name: Delta browser diagnostic

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/delta-probe.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run real Delta browser probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $report = [System.Collections.Generic.List[string]]::new()
          $root = Join-Path $env:RUNNER_TEMP "Delta Browser Probe"
          $portable = Join-Path $root "out/Delta_Portable"
          try {
            New-Item -ItemType Directory -Force -Path (Join-Path $root "out") | Out-Null
            $installer = Join-Path $root "delta-setup.exe"
            Invoke-WebRequest -UseBasicParsing `
              -Uri "https://releases.delta.dev/releases/stable/0.23.0/delta-windows-x86_64-setup.exe" `
              -OutFile $installer
            $report.Add("Installer downloaded")
            $arguments = 'build "' + $installer + '" --out "' +
              (Join-Path $root "out") + '" --name Delta --single-file --no-registry ' +
              '--no-netstack --hard-timeout 180'
            $builder = Start-Process -FilePath (Resolve-Path "dist-windows/Portablizer.exe").Path `
              -ArgumentList $arguments -PassThru
            if (-not $builder.WaitForExit(600000)) {
              $builder.Kill()
              throw "Builder timed out"
            }
            $report.Add("Builder exit: $($builder.ExitCode)")
            if ($builder.ExitCode -ne 0) { throw "Builder failed" }
            $configPath = Join-Path $portable "launcher_config.json"
            $configText = Get-Content $configPath -Raw
            $config = $configText | ConvertFrom-Json
            $report.Add("Target: $($config.target_exe_rel)")
            $deltaCli = Get-ChildItem (Join-Path $portable "App") `
              -Recurse -File -Filter "Delta.exe" | Select-Object -First 1
            if (-not $deltaCli) { throw "Delta CLI was not found" }
            $cliTarget = $deltaCli.FullName.Substring($portable.Length + 1).Replace('\', '/')
            $report.Add("CLI target: $cliTarget")
            $env:DELTA_CLI_FOR_STRINGS = $deltaCli.FullName
            $env:DELTA_APP_FOR_STRINGS = (Join-Path $portable "App/delta-app.exe")
            $env:PYTHONIOENCODING = "utf-8"
            $stringReport = @'
          import os, re
          for label, key in (("CLI", "DELTA_CLI_FOR_STRINGS"), ("APP", "DELTA_APP_FOR_STRINGS")):
              path = os.environ[key]
              data = open(path, "rb").read()
              print("BINARY", label, path)
              tokens = sorted(set(re.findall(rb"DELTA_[A-Z0-9_]+", data)))
              for token in tokens:
                  print("ENV", token.decode("ascii", "ignore"))
              for match in re.finditer(rb"delta-ipc", data, re.I):
                  chunk = data[max(0, match.start() - 180):match.end() + 220]
                  text = "".join(chr(c) if 32 <= c < 127 else "." for c in chunk)
                  print("IPC_CONTEXT", text)
          '@ | python -
            $report.Add("--- relevant binary strings ---")
            foreach ($line in @($stringReport)) { $report.Add([string]$line) }
            $helpOut = Join-Path $root "auth-help.out"
            $helpErr = Join-Path $root "auth-help.err"
            $help = Start-Process -FilePath $deltaCli.FullName `
              -ArgumentList @("auth", "login", "--help") -PassThru `
              -RedirectStandardOutput $helpOut -RedirectStandardError $helpErr
            if (-not $help.WaitForExit(30000)) {
              $help.Kill()
              $report.Add("Direct auth help timed out")
            }
            else {
              $report.Add("Direct auth help exit: $($help.ExitCode)")
            }
            if (Test-Path $helpOut) {
              foreach ($line in @(Get-Content $helpOut -Tail 40)) {
                $report.Add("help out: $line")
              }
            }
            if (Test-Path $helpErr) {
              foreach ($line in @(Get-Content $helpErr -Tail 40)) {
                $report.Add("help err: $line")
              }
            }
            $authConfig = $configText | ConvertFrom-Json
            $authConfig.browser_login.connect_host_profile = $false
            $authConfig.browser_login.clean_duplicates = $false
            $authConfig | ConvertTo-Json -Depth 20 |
              Set-Content -Encoding utf8 $configPath
            $env:PORTABLE_LAUNCHER_NO_UI = "1"
            $runLog = Join-Path $portable "PortableData/launcher-run.log"
            $guiOutput = Join-Path $root "gui.out"
            $guiError = Join-Path $root "gui.err"
            # Start the desktop application first.  delta auth login is an
            # IPC client of this running application, not a standalone UI.
            $gui = Start-Process -FilePath (Join-Path $portable "Launch.bat") `
              -WorkingDirectory $portable -PassThru `
              -RedirectStandardOutput $guiOutput -RedirectStandardError $guiError
            Start-Sleep -Seconds 12
            $report.Add("GUI BAT exited: $($gui.HasExited)")
            if (Test-Path $runLog) {
              $guiText = Get-Content $runLog -Raw
              $report.Add("GUI started through launcher: $($guiText -match 'start:.*delta-app\.exe')")
            }

            # Ask the running app for a browser sign-in handoff.  Use the
            # same portable profile for this small CLI client, but do not
            # start a second desktop application.
            $authOutput = Join-Path $root "auth.out"
            $authError = Join-Path $root "auth.err"
            $data = Join-Path $portable "PortableData"
            $childEnv = @{
              APPDATA = Join-Path $data "AppData/Roaming"
              LOCALAPPDATA = Join-Path $data "AppData/Local"
              USERPROFILE = Join-Path $data "User"
              TEMP = Join-Path $data "Temp"
              TMP = Join-Path $data "Temp"
            }
            $oldEnv = @{}
            foreach ($entry in $childEnv.GetEnumerator()) {
              $oldEnv[$entry.Key] = [Environment]::GetEnvironmentVariable($entry.Key)
              [Environment]::SetEnvironmentVariable($entry.Key, $entry.Value)
            }
            try {
              $auth = Start-Process -FilePath $deltaCli.FullName `
                -ArgumentList @("auth", "login", "--no-wait") -PassThru `
                -RedirectStandardOutput $authOutput -RedirectStandardError $authError
            }
            finally {
              foreach ($key in $oldEnv.Keys) {
                [Environment]::SetEnvironmentVariable($key, $oldEnv[$key])
              }
            }
            if (-not $auth.WaitForExit(30000)) {
              $auth.Kill()
              $report.Add("Auth handoff timed out")
            }
            else {
              $report.Add("Auth handoff exit: $($auth.ExitCode)")
            }
            $found = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if (Test-Path $runLog) {
                $runText = Get-Content $runLog -Raw
                if ($runText -match 'dashboard\.zed\.dev/delta-beta') {
                  $found = $true
                  break
                }
              }
              Start-Sleep -Seconds 1
            }
            $report.Add("Terms URL observed in launcher log: $found")
            if (-not $found) { $report.Add("PROBE RESULT: URL WAS NOT FORWARDED") }
            else { $report.Add("PROBE RESULT: URL FORWARDED") }
          }
          catch {
            $report.Add("ERROR: $($_.Exception.Message)")
          }
          finally {
            $prefix = $portable.TrimEnd('\') + '\'
            foreach ($candidate in @(Get-Process -ErrorAction SilentlyContinue)) {
              try {
                $image = $candidate.Path
                if ($image -and $image.StartsWith($prefix,
                    [StringComparison]::OrdinalIgnoreCase)) {
                  Stop-Process -Id $candidate.Id -Force -ErrorAction SilentlyContinue
                }
              }
              catch { }
            }
            foreach ($item in @(
                @{Name = "gui.out"; Path = (Join-Path $root "gui.out")},
                @{Name = "gui.err"; Path = (Join-Path $root "gui.err")},
                @{Name = "auth.out"; Path = (Join-Path $root "auth.out")},
                @{Name = "auth.err"; Path = (Join-Path $root "auth.err")},
                @{Name = "launcher-run.log"; Path = (Join-Path $portable "PortableData/launcher-run.log")},
                @{Name = "launcher-exe-error.log"; Path = (Join-Path $portable "PortableData/launcher-exe-error.log")},
                @{Name = "portablizer.log"; Path = (Join-Path $portable "portablizer.log")})) {
              if (Test-Path $item.Path) {
                $report.Add("--- $($item.Name) ---")
                foreach ($line in @(Get-Content $item.Path -Tail 100)) {
                  $report.Add([string]$line)
                }
              }
            }
            $report | Set-Content -Encoding utf8 "delta-auth-probe.txt"
          }

      - name: Publish probe report
        if: always()
        shell: bash
        run: |
          set -e
          if [ ! -f delta-auth-probe.txt ]; then
            printf '%s\n' 'Probe did not produce a report.' > delta-auth-probe.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f delta-auth-probe.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: Delta browser diagnostic [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
