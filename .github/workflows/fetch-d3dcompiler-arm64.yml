name: Fetch Windows SDK D3DCompiler ARM64

# Временный служебный прогон: копирует официальный app-local ARM64 DLL из
# установленного на Windows-раннере SDK и коммитит его с хешем в ресурсы.
on:
  push:
    branches: ["arena/782f6c71-test"]

permissions:
  contents: write

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract official ARM64 DLL from Windows SDK
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          @'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          from portablizer.core import redist

          candidates = []
          for directory in redist.windows_sdk_d3d_dirs_for("arm64"):
              path = Path(directory) / "d3dcompiler_47.dll"
              if path.is_file() and redist.read_pe_imports(str(path)).machine == "arm64":
                  candidates.append(path)
          if not candidates:
              raise RuntimeError("Windows SDK D3DCompiler ARM64 was not found")
          source = candidates[0]
          target_dir = Path("portablizer/resources/redist/arm64")
          target_dir.mkdir(parents=True, exist_ok=True)
          target = target_dir / "d3dcompiler_47.dll"
          shutil.copy2(source, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          provenance_path = Path("portablizer/resources/redist/provenance.json")
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          provenance = [item for item in provenance if item.get("architecture") != "arm64"]
          provenance.append({
              "architecture": "arm64",
              "source": "Windows SDK 10 Redist/D3D/arm64",
              "dll_sha256": digest,
              "dll_size": target.stat().st_size,
          })
          provenance_path.write_text(
              json.dumps(provenance, indent=2), encoding="utf-8")
          print(f"ARM64 SDK source: {source}")
          print(f"ARM64 DLL SHA256={digest}; size={target.stat().st_size}")
          '@ | python -X utf8 -
      - name: Verify ARM64 payload and commit it
        shell: pwsh
        run: |
          $file = "portablizer/resources/redist/arm64/d3dcompiler_47.dll"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = (Get-Item $file).VersionInfo.FileVersion
          $signature = Get-AuthenticodeSignature $file
          Write-Host "ARM64: version=$version hash=$hash signature=$($signature.Status) signer=$($signature.SignerCertificate.Subject)"
          if (-not $version) { throw "Windows SDK DLL has no file version" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "portablizer/resources/redist/arm64/d3dcompiler_47.dll" `
            "portablizer/resources/redist/provenance.json"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Official ARM64 D3DCompiler resource is already up to date"
            exit 0
          }
          git commit -m "Add Windows SDK D3DCompiler ARM64 resource [skip ci]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:arena/782f6c71-test
