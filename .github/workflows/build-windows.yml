name: Build Windows EXE

# Собирает Portablizer.exe на настоящем Windows-раннере и публикует артефакт.
on:
  push:
    branches: [ "arena/**" ]
    paths:
      - "portablizer/**"
      - "app.py"
      - "portablizer.spec"
      - "portable_launcher.spec"
      - "portable_launcher_onedir.spec"
      - "portable_launcher_entry.py"
      - "build.bat"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: write

# Новый пуш в ветку отменяет предыдущую сборку: зависший прогон не должен
# занимать раннер часами и мешать следующему.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # Обычная сборка укладывается в 3-5 минут. Больше получаса — значит
    # что-то зависло (например, лончер ждёт процесс, который не завершается).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record build source
        shell: pwsh
        run: |
          "## Windows EXE build source" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Commit: ``$env:GITHUB_SHA``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Ref: ``$env:GITHUB_REF_NAME``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build portable App launcher
        shell: pwsh
        run: |
          # Два варианта одного и того же лончера:
          #  * onedir (папка) — кладётся в портатив и НЕ распаковывает себя
          #    при запуске: именно это убирает «фоновый процесс есть, а окно
          #    программы появляется через секунды»;
          #  * onefile — запасной, если папку разложить не удалось.
          pyinstaller --noconfirm --clean portable_launcher.spec
          Copy-Item -Force dist/PortableLauncher.exe portablizer/resources/portable_launcher.exe
          pyinstaller --noconfirm --clean portable_launcher_onedir.spec
          Remove-Item -Recurse -Force portablizer/resources/portable_launcher -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force dist/PortableLauncher portablizer/resources/portable_launcher

      - name: Build EXE
        run: pyinstaller --noconfirm --clean portablizer.spec

      - name: Verify embedded D3DCompiler 47 resources
        shell: pwsh
        run: |
          @'
          from PyInstaller.archive.readers import CArchiveReader

          archive = CArchiveReader(r"dist/Portablizer.exe")
          names = {name.replace("\\", "/") for name in archive.toc}
          expected = {
              "resources/redist/x86/d3dcompiler_47.dll",
              "resources/redist/x64/d3dcompiler_47.dll",
              "resources/redist/arm64/d3dcompiler_47.dll",
          }
          missing = sorted(expected - names)
          if missing:
              raise RuntimeError(f"Resources missing from Portablizer.exe: {missing}")
          print("Portablizer.exe contains offline D3DCompiler 47 x86, x64 and ARM64")
          '@ | python -

      # Unit-test failures are reported after the Windows smoke checks and
      # artifact publication, so unrelated failures do not discard a valid build.
      - name: Run tests
        id: unit_tests
        continue-on-error: true
        shell: pwsh
        # Модули идут отдельными процессами с потолком времени каждый: у
        # зависшего модуля печатаются стеки всех потоков, а остальные модули
        # всё равно прогоняются (см. tests/run_all.py).
        env:
          # Имена тестов и сообщения — на русском; без этого первый же вывод
          # падает на UnicodeEncodeError (стандартный вывод Windows не UTF-8).
          PYTHONIOENCODING: utf-8
        run: |
          python -u tests/run_all.py 2>&1 | Tee-Object -FilePath test-output.log
          $testStatus = $LASTEXITCODE
          "## Windows test output" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content test-output.log -Tail 160 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($testStatus -ne 0) {
            # Имя упавшего модуля — в ЗАГОЛОВОК аннотации: хвоста журнала
            # (последние 80 строк) мало, чтобы понять, какой модуль упал
            # первым, а полный журнал доступен только артефактом.
            $failedModules = @(Select-String -Path test-output.log -Pattern '^!! ' |
              ForEach-Object { $_.Line.Trim() }) -join '; '
            if (-not $failedModules) { $failedModules = 'unknown module' }
            $title = "Windows unit tests failed: $failedModules"
            if ($title.Length -gt 250) { $title = $title.Substring(0, 250) }
            # Сначала — только имена упавших модулей и тестов: в хвосте
            # журнала их уже не видно, а именно они отвечают на вопрос «что
            # сломалось», не заставляя скачивать артефакт.
            $headline = @(Select-String -Path test-output.log `
              -Pattern '^(FAIL|ERROR): |^!! |^(AssertionError|Assertion|ValueError|[A-Za-z_.]*Error|[A-Za-z_.]*Exception)[:] ' |
              ForEach-Object { $_.Line.Trim() }) -join "`n"
            $diagnostic = $headline + "`n---`n" + `
              ((Get-Content test-output.log -Tail 80) -join "`n")
            $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=$title::$diagnostic"
          }
          exit $testStatus

      - name: Test official D3DCompiler 47 packages
        shell: pwsh
        timeout-minutes: 5
        env:
          PYTHONIOENCODING: utf-8
          PORTABLIZER_LIVE_REDIST_TEST: "1"
        # Настоящие MSU с download.microsoft.com, а не только synthetic CAB:
        # x86-пакет обязан дать x86 DLL, x64-пакет — обе разрядности. Тест
        # использует только распаковку и никогда не запускает WUSA.
        run: |
          python -m unittest -v tests.test_redist.RuntimeProvisionTests.test_official_d3dcompiler_47_packages_extract_on_windows

      # Регрессия 1.20.0: собранный exe не запускался вовсе — на импорте
      # вызывался inspect.getsource, а исходников в PyInstaller-сборке нет
      # ("OSError: could not get source code"). Юнит-тесты этого не видели:
      # они всегда шли из исходников. Здесь запускается именно собранный exe.
      - name: Smoke test - the built Portablizer.exe starts
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "portablizer-crash.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:PORTABLIZER_CRASH_LOG = $log
          # --version: тот же путь импорта, что и у окна, но без GUI.
          $output = & .\dist\Portablizer.exe --version 2>&1 | Out-String
          $code = $LASTEXITCODE
          if (Test-Path $log) {
            Write-Host "::error title=Portablizer.exe did not start::"
            Get-Content $log -Tail 40 | ForEach-Object { Write-Host $_ }
            exit 1
          }
          if ($code -ne 0) {
            Write-Host "::error title=Portablizer.exe exited with $code::"
            Write-Host $output
            exit 1
          }
          Write-Host "Portablizer.exe started: $($output.Trim())"

      - name: Smoke test - real Delta WiX Burn payload
        shell: pwsh
        run: |
          # Регрессия 1.42.0: у Delta 0.23.0 /layout возвращает только копию
          # того же bundle, а настоящий Delta.msi появляется в redirected
          # Package Cache после quiet /install. Здесь выполняется не mock, а
          # официальный установщик и полная сборка через готовый EXE.
          $root = Join-Path $env:RUNNER_TEMP "Delta Burn Smoke"
          $out = Join-Path $root "out"
          $installer = Join-Path $root "delta-windows-x86_64-setup.exe"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://releases.delta.dev/releases/stable/0.23.0/delta-windows-x86_64-setup.exe" `
            -OutFile $installer
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Delta 0.23.0 installer SHA256: $actualHash"
          $expectedHash = "c8d46fb62e1b6ae569ac7f2d6bd0c84c1b895703640f9493feced46e54e4bc48"
          if ($expectedHash -and $actualHash -ne $expectedHash) {
            throw "Delta installer hash mismatch: expected $expectedHash, got $actualHash"
          }

          # Состояние из жалобы: bundle уже Present, а MSI остался в
          # PortableData после прошлой попытки. На абсолютно чистом runner
          # первый /install может поставить Delta прямо в App и обойти нужную
          # регрессионную ветку, поэтому сначала создаём это состояние тем же
          # официальным установщиком.
          $portable = Join-Path $out "Delta_Portable"
          $seedData = Join-Path $portable "PortableData"
          $seedApp = Join-Path $portable "App"
          $seedLog = Join-Path $root "seed-install.log"
          $seedEnv = @{
            APPDATA = Join-Path $seedData "AppData/Roaming"
            LOCALAPPDATA = Join-Path $seedData "AppData/Local"
            USERPROFILE = Join-Path $seedData "User"
            PROGRAMDATA = Join-Path $seedData "ProgramData"
            TEMP = Join-Path $seedData "Temp"
            TMP = Join-Path $seedData "Temp"
          }
          New-Item -ItemType Directory -Force -Path $seedApp,
            (Join-Path $seedData "User/AppData/Local"),
            (Join-Path $seedData "User/AppData/Roaming") | Out-Null
          $oldEnv = @{}
          foreach ($entry in $seedEnv.GetEnumerator()) {
            $oldEnv[$entry.Key] = [Environment]::GetEnvironmentVariable($entry.Key)
            New-Item -ItemType Directory -Force -Path $entry.Value | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key, $entry.Value)
          }
          try {
            $seedArguments = '/quiet /norestart /install "InstallFolder=' +
              $seedApp + '" /log "' + $seedLog + '"'
            $seedProcess = Start-Process -FilePath $installer `
              -ArgumentList $seedArguments -PassThru
            if (-not $seedProcess.WaitForExit(180000)) {
              $seedProcess.Kill()
              throw "Delta seed install did not exit within 180 s"
            }
          }
          finally {
            foreach ($key in $oldEnv.Keys) {
              [Environment]::SetEnvironmentVariable($key, $oldEnv[$key])
            }
          }
          if ($seedProcess.ExitCode -notin @(0, 3010)) {
            if (Test-Path $seedLog) { Get-Content $seedLog -Tail 100 }
            throw "Delta seed install failed with exit $($seedProcess.ExitCode)"
          }
          $seededMsi = @(Get-ChildItem $seedData -Recurse -File -Filter "*.msi" |
            Where-Object { $_.FullName -match 'Package Cache' })
          if ($seededMsi.Count -eq 0) {
            if (Test-Path $seedLog) { Get-Content $seedLog -Tail 100 }
            throw "Delta seed install did not create a cached MSI"
          }
          Write-Host "Seeded Present bundle cache: $($seededMsi.FullName -join ', ')"

          $crashLog = Join-Path $root "portablizer-crash.log"
          $env:PORTABLIZER_CRASH_LOG = $crashLog
          # Полный комплект остаётся включён, а --download-runtimes намеренно
          # не передаётся: это точный сценарий жалобы. Delta требует
          # D3DCompiler 47 для x64 и ARM64 (не x86), обе DLL должны быть в App.
          # На windows-latest SDK уже установлен. Скрываем только его корни для
          # процесса builder, иначе ARM64 снова придёт из SDK и smoke не
          # докажет автономный ресурс. ProgramFiles и реестр не изменяются.
          $arguments = 'build "' + $installer + '" --out "' + $out + '" ' +
            '--name Delta --single-file --no-registry ' +
            '--no-netstack --hard-timeout 180'
          $sdkVariable = "PORTABLIZER_WINDOWS_SDK_ROOT"
          $oldSdkRoot = [Environment]::GetEnvironmentVariable($sdkVariable)
          [Environment]::SetEnvironmentVariable(
            $sdkVariable, (Join-Path $root "No Windows SDK"))
          try {
            $process = Start-Process `
              -FilePath (Resolve-Path "dist/Portablizer.exe").Path `
              -ArgumentList $arguments -PassThru
          }
          finally {
            [Environment]::SetEnvironmentVariable($sdkVariable, $oldSdkRoot)
          }
          if (-not $process.WaitForExit(600000)) {
            $process.Kill()
            throw "Delta portable build did not exit within 600 s"
          }

          if ($process.ExitCode -ne 0 -or (Test-Path $crashLog)) {
            foreach ($name in @(
                "portablizer-crash.log", "out/portablizer-cli.log",
                "out/Delta_Portable/portablizer.log",
                "out/Delta_Portable/install-layout.log",
                "out/Delta_Portable/install.log",
                "out/Delta_Portable/install-repair.log",
                "out/Delta_Portable/install-retry.log",
                "out/Delta_Portable/burn-cache-msi-1.log",
                "out/Delta_Portable/installer-output.log")) {
              $path = Join-Path $root $name
              if (Test-Path $path) {
                Write-Host "--- $name (tail) ---"
                Get-Content $path -Tail 160 | ForEach-Object { Write-Host $_ }
              }
            }
            throw "Delta portable build failed with exit $($process.ExitCode)"
          }

          Write-Host "Delta builder exit: $($process.ExitCode)"
          $debugBuildLog = Join-Path $portable "portablizer.log"
          if (Test-Path $debugBuildLog) {
            Write-Host "--- Delta portablizer.log (tail) ---"
            Get-Content $debugBuildLog -Tail 220 | ForEach-Object { Write-Host $_ }
          }
          $debugInstallerOutput = Join-Path $portable "installer-output.log"
          if (Test-Path $debugInstallerOutput) {
            Write-Host "--- Delta installer-output.log (tail) ---"
            Get-Content $debugInstallerOutput -Tail 140 |
              ForEach-Object { Write-Host $_ }
          }

          $mainExe = Get-ChildItem (Join-Path $portable "App") `
            -Recurse -File -Filter "Delta.exe" | Select-Object -First 1
          if (-not $mainExe) {
            Get-ChildItem (Join-Path $portable "App") -Recurse -File |
              Select-Object -First 100 FullName, Length |
              Format-Table -AutoSize
            throw "Delta.exe was not unpacked into App"
          }
          $deltaApp = Get-ChildItem (Join-Path $portable "App") `
            -Recurse -File -Filter "delta-app.exe" | Select-Object -First 1
          if (-not $deltaApp) {
            throw "delta-app.exe was not unpacked into App"
          }
          $versionOut = Join-Path $root "delta-version.out"
          $versionErr = Join-Path $root "delta-version.err"
          $versionProcess = Start-Process -FilePath $deltaApp.FullName `
            -ArgumentList "--version" -PassThru `
            -RedirectStandardOutput $versionOut -RedirectStandardError $versionErr
          if (-not $versionProcess.WaitForExit(30000)) {
            $versionProcess.Kill()
            throw "delta-app.exe --version did not exit within 30 s"
          }
          $versionText = ((Get-Content $versionOut -Raw) +
            (Get-Content $versionErr -Raw)).Trim()
          if ($versionProcess.ExitCode -ne 0 -or
              $versionText -notmatch '0\.23\.0') {
            throw "delta-app.exe --version failed ($($versionProcess.ExitCode)): $versionText"
          }
          Write-Host "Delta runtime check: $versionText"
          $appFiles = @(Get-ChildItem (Join-Path $portable "App") -Recurse -File)
          $appBytes = ($appFiles | Measure-Object Length -Sum).Sum
          if ($appFiles.Count -lt 5 -or $appBytes -lt 1MB) {
            throw "Delta App is not a real payload: $($appFiles.Count) files, $appBytes bytes"
          }
          $configPath = Join-Path $portable "launcher_config.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($config.target_exe_rel -notmatch '^App/' -or
              $config.target_exe_rel -match 'Setup|Installer|Package Cache') {
            throw "Unsafe Delta launcher target: $($config.target_exe_rel)"
          }
          if (-not (Test-Path (Join-Path $portable $config.target_exe_rel))) {
            throw "Delta launcher target does not exist: $($config.target_exe_rel)"
          }
          if ($config.target_exe_rel -notmatch '(?i)(^|/)delta-app\.exe$') {
            throw "Delta Launch.bat must target the desktop delta-app.exe, not the CLI: $($config.target_exe_rel)"
          }

          # Exercise the actual Launch.bat -> EXE handoff, not only a direct
          # delta-app.exe invocation.  --version is forwarded to the real GUI
          # binary and exits without needing an interactive desktop session.
          # A console fallback would bypass this launcher journal and was the
          # source of the second, differently configured Delta process.
          $env:PORTABLE_LAUNCHER_NO_UI = "1"
          $batOutput = Join-Path $root "delta-launch-bat.out"
          & (Join-Path $portable "Launch.bat") --version *> $batOutput
          $runLog = Join-Path $portable "PortableData/launcher-run.log"
          $handoffOk = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            if (Test-Path $runLog) {
              $runText = Get-Content $runLog -Raw
              if ($runText -match 'delta-app\.exe exited with code 0') {
                $handoffOk = $true
                break
              }
            }
            Start-Sleep -Seconds 1
          }
          if (-not $handoffOk) {
            if (Test-Path $batOutput) { Get-Content $batOutput -Tail 80 }
            if (Test-Path $runLog) { Get-Content $runLog -Tail 120 }
            throw "Launch.bat did not run delta-app.exe through LaunchPortable.exe"
          }
          Write-Host "Delta Launch.bat handoff: delta-app.exe exited with code 0"

          # Browser sign-in regression: use the real Delta CLI, but start it
          # through the ordinary Launch.bat -> LaunchPortable.exe path.  The
          # profile junction is deliberately disabled for this probe so the
          # process/URL fallback must prove that it saw the terms page.  No
          # credentials are entered and the temporary process is stopped.
          $configText = Get-Content $configPath -Raw
          $authOutput = Join-Path $root "delta-auth.out"
          $authError = Join-Path $root "delta-auth.err"
          $authProcess = $null
          $authUrlFound = $false
          try {
            $authConfig = $configText | ConvertFrom-Json
            $authConfig.browser_login.connect_host_profile = $false
            $authConfig.browser_login.clean_duplicates = $false
            $authConfig | ConvertTo-Json -Depth 20 |
              Set-Content -Encoding utf8 $configPath
            $authProcess = Start-Process -FilePath (Join-Path $portable "Launch.bat") `
              -ArgumentList @("--target", "App/Delta.exe", "auth", "login") `
              -WorkingDirectory $portable -PassThru `
              -RedirectStandardOutput $authOutput -RedirectStandardError $authError
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              if (Test-Path $runLog) {
                $runText = Get-Content $runLog -Raw
                if ($runText -match 'browser login: opened https://dashboard\.zed\.dev/delta-beta') {
                  $authUrlFound = $true
                  break
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $authUrlFound) {
              $details = @()
              if (Test-Path $authOutput) { $details += Get-Content $authOutput -Tail 40 }
              if (Test-Path $authError) { $details += Get-Content $authError -Tail 40 }
              if (Test-Path $runLog) { $details += Get-Content $runLog -Tail 100 }
              throw ("Delta auth login did not forward the terms URL through " +
                "Launch.bat. " + ($details -join "`n"))
            }
            Write-Host "Delta browser auth handoff: dashboard.zed.dev/delta-beta opened"
          }
          finally {
            # Only processes whose image is inside this temporary portable
            # are stopped; the host browser and its existing windows remain.
            $prefix = $portable.TrimEnd('\') + '\'
            foreach ($candidate in @(Get-Process -ErrorAction SilentlyContinue)) {
              try {
                $image = $candidate.Path
                if ($image -and $image.StartsWith($prefix,
                    [StringComparison]::OrdinalIgnoreCase)) {
                  Stop-Process -Id $candidate.Id -Force -ErrorAction SilentlyContinue
                }
              }
              catch { }
            }
            Set-Content -Encoding utf8 -Path $configPath -Value $configText
          }
          $buildLog = Join-Path $portable "portablizer.log"
          $buildLogText = Get-Content $buildLog -Raw
          if ($buildLogText -notmatch 'Сработал запасной сценарий: WiX Burn: /quiet /repair') {
            Get-Content $buildLog -Tail 160 | ForEach-Object { Write-Host $_ }
            throw "Delta did not recover the Present package through Burn repair"
          }
          if ($buildLogText -match 'Не удалось найти файлы для:[^\r\n]*d3dcompiler_47\.dll') {
            Get-Content $buildLog -Tail 160 | ForEach-Object { Write-Host $_ }
            throw "D3DCompiler 47 is still reported as missing in the offline full-kit build"
          }
          $env:DELTA_APP_DIR = Join-Path $portable "App"
          $env:DELTA_REPORT = Join-Path $portable "redistributables.txt"
          @'
          import os
          from pathlib import Path
          from portablizer.core.redist import read_pe_imports

          found = {}
          for path in Path(os.environ["DELTA_APP_DIR"]).rglob("d3dcompiler_47.dll"):
              machine = read_pe_imports(str(path)).machine
              found.setdefault(machine, []).append(str(path))
          missing = {"x64", "arm64"} - set(found)
          if missing:
              raise RuntimeError(f"Delta portable lacks D3DCompiler 47 architectures: {sorted(missing)}; found={found}")

          report = Path(os.environ["DELTA_REPORT"]).read_text(encoding="utf-8-sig")
          headings = (
              "Принесено в портатив (на целевом ПК ставить ничего не нужно)",
              "Принесено про запас — полный комплект всех redistributables",
              "Входит в состав программы (принёс сам установщик)",
              "ТРЕБУЕТСЯ НА ЦЕЛЕВОМ ПК — файлы найти не удалось",
              "Полный комплект: найти не удалось (программе, скорее всего, не нужно)",
              "Не опознано (проверьте вручную, если программа не запускается)",
          )
          positions = sorted((report.index(title), title) for title in headings
                             if title in report)
          sections = {}
          for index, (position, title) in enumerate(positions):
              end = positions[index + 1][0] if index + 1 < len(positions) else len(report)
              sections[title] = report[position:end]
          for title in headings[3:5]:
              if "d3dcompiler_47.dll" in sections.get(title, ""):
                  raise RuntimeError(f"Delta still reports D3DCompiler 47 in: {title}")
          embedded_arm64 = ("• d3dcompiler_47.dll [arm64] — "
                            "встроенный официальный redist Microsoft")
          if embedded_arm64 not in sections.get(headings[0], ""):
              raise RuntimeError("Delta ARM64 DLL did not come from the embedded resource")
          print(f"Delta offline full kit contains embedded ARM64 and x64 D3DCompiler 47: {found}")
          '@ | python -
          $cacheDirs = @(Get-ChildItem $portable -Recurse -Directory `
            -Filter "Package Cache" -ErrorAction SilentlyContinue)
          $layoutPath = Join-Path $portable "_bundle_layout"
          $layoutLeft = Test-Path $layoutPath
          if ($cacheDirs.Count -ne 0 -or $layoutLeft) {
            Write-Host "Remaining Package Cache: $($cacheDirs.FullName -join ', ')"
            Write-Host "Burn layout remains: $layoutLeft ($layoutPath)"
            if ($layoutLeft) {
              Get-ChildItem $layoutPath -Recurse -Force |
                Select-Object FullName, Attributes | Format-Table -AutoSize
            }
            if (Test-Path $buildLog) {
              Write-Host "--- Delta portablizer.log (tail) ---"
              Get-Content $buildLog -Tail 140 | ForEach-Object { Write-Host $_ }
            }
            throw "Delta installer cache/layout leaked into the finished portable"
          }
          Write-Host ("Real Delta portable: {0}; {1} App files, {2:N1} MiB" -f
            $config.target_exe_rel, $appFiles.Count, ($appBytes / 1MB))
          Remove-Item -Recurse -Force $root -ErrorAction Stop

      - name: Smoke test portable App EXE
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "Portable Launcher Smoke"
          New-Item -ItemType Directory -Force -Path (Join-Path $root "App") | Out-Null
          Copy-Item dist/PortableLauncher.exe (Join-Path $root "App/LaunchPortable.exe")
          Copy-Item $env:ComSpec (Join-Path $root "App/cmd.exe")
          # cmd.exe keeps localized messages in a sibling MUI file. Preserve it
          # when copying cmd outside System32 so the smoke target remains valid.
          $culture = (Get-UICulture).Name
          $muiSource = Join-Path (Split-Path $env:ComSpec) "$culture/cmd.exe.mui"
          if (Test-Path $muiSource) {
            New-Item -ItemType Directory -Force -Path (Join-Path $root "App/$culture") | Out-Null
            Copy-Item $muiSource (Join-Path $root "App/$culture/cmd.exe.mui")
          }
          @{
            app_name = "Smoke"
            target_exe_rel = "App/cmd.exe"
            target_args = @()
            data_dir_name = "PortableData"
            path_prepend = @("App")
            extra_env = @{}
            registry = @{ enabled = $false }
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $root "launcher_config.json")
          # Start-Process -Wait is intentional: PowerShell can return immediately
          # for a windowed (GUI-subsystem) EXE and leave $LASTEXITCODE unset.
          $process = Start-Process -FilePath (Join-Path $root "App/LaunchPortable.exe") `
            -ArgumentList '/d /c "set PORTABLE_APP>launcher-smoke.txt"' `
            -PassThru
          # Лончер обязан завершиться сам: если он ждёт процесс, которого
          # нет (например, собственный загрузчик PyInstaller), прогон должен
          # упасть с понятной ошибкой, а не висеть часами.
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            Write-Host "::error title=LaunchPortable.exe smoke failure::the launcher did not exit within 180 s"
            throw "LaunchPortable.exe did not exit within 180 s"
          }
          if ($process.ExitCode -ne 0) {
            $errorLog = Join-Path $root "PortableData/launcher-exe-error.log"
            $details = if (Test-Path $errorLog) { Get-Content $errorLog -Raw } else { "no launcher error log" }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=LaunchPortable.exe smoke failure::exit=$($process.ExitCode); $details"
            throw "LaunchPortable.exe returned $($process.ExitCode)"
          }
          $markerPath = Join-Path $root "App/launcher-smoke.txt"
          if (-not (Test-Path $markerPath)) {
            Write-Host "::error title=LaunchPortable.exe smoke failure::target marker was not created"
            throw "Target marker was not created"
          }
          $marker = (Get-Content $markerPath -Raw).Trim()
          if ($marker -ne "PORTABLE_APP=1") {
            Write-Host "::error title=LaunchPortable.exe smoke failure::portable environment marker is '$marker'"
            throw "Portable environment was not passed to target: $marker"
          }
          if (-not (Test-Path (Join-Path $root "PortableData/User/Documents/My Games"))) {
            Write-Host "::error title=LaunchPortable.exe smoke failure::portable profile tree was not created"
            throw "Portable profile tree was not created"
          }

      - name: Smoke test - the portable folder must be deletable afterwards
        shell: pwsh
        run: |
          # Регрессия на главную жалобу: программа закрыта, а папку удалить
          # нельзя, потому что из неё остался работать фоновый процесс.
          # Цель запускает «помощника» из той же папки и сразу завершается.
          # Лончер обязан дождаться, закрыть остаток и отпустить папку.
          $root = Join-Path $env:RUNNER_TEMP "Portable Leftover Smoke"
          New-Item -ItemType Directory -Force -Path (Join-Path $root "App") | Out-Null
          Copy-Item dist/PortableLauncher.exe (Join-Path $root "App/LaunchPortable.exe")
          Copy-Item $env:ComSpec (Join-Path $root "App/cmd.exe")
          $culture = (Get-UICulture).Name
          $muiSource = Join-Path (Split-Path $env:ComSpec) "$culture/cmd.exe.mui"
          if (Test-Path $muiSource) {
            New-Item -ItemType Directory -Force -Path (Join-Path $root "App/$culture") | Out-Null
            Copy-Item $muiSource (Join-Path $root "App/$culture/cmd.exe.mui")
          }
          @{
            app_name = "Leftover"
            target_exe_rel = "App/cmd.exe"
            target_args = @()
            data_dir_name = "PortableData"
            registry = @{ enabled = $false }
            # Ускоряем именно то, что проверяем: фоновому процессу без окна
            # даётся 5 секунд вместо штатных 20.
            shutdown = @{ spawn_grace = 4.0; idle_grace = 5.0; close_grace = 2.0 }
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $root "launcher_config.json")

          $leftover = '/d /c start /b "" "' + (Join-Path $root "App/cmd.exe") + '" /c ping -n 300 127.0.0.1'
          $process = Start-Process -FilePath (Join-Path $root "App/LaunchPortable.exe") `
            -ArgumentList $leftover -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            Write-Host "::error title=Leftover smoke failure::the launcher did not exit within 180 s"
            throw "LaunchPortable.exe did not exit within 180 s"
          }

          $prefix = $root.TrimEnd('\') + '\'
          $still = @()
          foreach ($p in [Diagnostics.Process]::GetProcesses()) {
            $f = ''
            try { $f = $p.Path } catch { $f = '' }
            if ($f -and $f.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) { $still += $f }
          }
          if ($still.Count -gt 0) {
            Write-Host "::error title=Leftover smoke failure::still running: $($still -join ', ')"
            throw "Processes from the portable folder outlived the launcher"
          }

          # Лончер обязан не просто убрать за собой, но и записать вердикт:
          # это единственная диагностика, которая остаётся у пользователя.
          # Заодно проверяется, что новый глубокий поиск держателей (обход
          # модулей всех процессов системы) отрабатывает на живой Windows.
          $runLog = Join-Path $root "PortableData/launcher-run.log"
          if (-not (Test-Path $runLog)) {
            Write-Host "::error title=Leftover smoke failure::launcher-run.log was not written"
            throw "launcher-run.log was not written"
          }
          $logText = Get-Content $runLog -Raw
          Write-Host $logText
          if ($logText -notmatch 'portable folder released') {
            Write-Host "::error title=Leftover smoke failure::the launcher did not confirm the folder is free"
            throw "No 'portable folder released' verdict in launcher-run.log"
          }

          # Финальная проверка ровно в формулировке пользователя: папка
          # удаляется без «файл открыт в другой программе».
          Remove-Item -Recurse -Force $root -ErrorAction Stop
          if (Test-Path $root) {
            Write-Host "::error title=Leftover smoke failure::the portable folder could not be deleted"
            throw "The portable folder could not be deleted"
          }

      - name: Smoke test - a file locked from outside must be released
        shell: pwsh
        run: |
          # Регрессия на жалобу, ради которой всё затевалось: портатив НЕ
          # запущен, процессов из папки нет, а папку не удалить, потому что
          # внутри открыт файл (у пользователя - шрифт, распакованный
          # установщиком в PortableData\Temp и подхваченный службой Windows).
          # Файл открывается с FILE_SHARE_DELETE: именно поэтому пробное
          # переименование папки проходит, и старая проверка врала
          # "The folder is free".
          $root = Join-Path $env:RUNNER_TEMP "Portable Locked File Smoke"
          New-Item -ItemType Directory -Force -Path (Join-Path $root "App") | Out-Null
          Copy-Item dist/PortableLauncher.exe (Join-Path $root "App/LaunchPortable.exe")
          @{
            app_name = "Locked"
            target_exe_rel = "App/cmd.exe"
            data_dir_name = "PortableData"
            registry = @{ enabled = $false }
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $root "launcher_config.json")

          $tempDir = Join-Path $root "PortableData/Temp/is-UQUS2.tmp"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          $font = Join-Path $tempDir "OpenSans-Regular.ttf"
          Set-Content -LiteralPath $font -Value "font" -Encoding ascii

          $script = "`$s=[IO.File]::Open('$font','Open','Read','Delete'); Start-Sleep -Seconds 180"
          $holder = Start-Process powershell -PassThru -WindowStyle Hidden `
            -ArgumentList '-NoProfile', '-Command', $script
          Start-Sleep -Seconds 3

          # Файл действительно занят (проверяем, не ломая папку: удалять её
          # сейчас нельзя - рекурсивное удаление снесло бы половину до
          # первой ошибки, и проверять было бы уже нечего).
          $locked = $false
          try { $probe = [IO.File]::Open($font, 'Open', 'Read', 'None'); $probe.Close() }
          catch { $locked = $true }
          if (-not $locked) {
            if (-not $holder.HasExited) { $holder.Kill() }
            Write-Host "::warning title=Locked file smoke::the helper did not lock the file, nothing to test"
            exit 0
          }

          # --elevated гасит повторный запрос прав: на раннере UAC-окна быть
          # не может, а ждать его было бы нечем.
          $stop = Start-Process -FilePath (Join-Path $root "App/LaunchPortable.exe") `
            -ArgumentList '--stop', '--elevated' -PassThru
          if (-not $stop.WaitForExit(180000)) {
            $stop.Kill()
            if (-not $holder.HasExited) { $holder.Kill() }
            throw "LaunchPortable.exe --stop did not finish within 180 s"
          }
          $runLog = Join-Path $root "PortableData/launcher-run.log"
          if (Test-Path $runLog) { Write-Host (Get-Content $runLog -Raw) }
          if ($stop.ExitCode -ne 0) {
            if (-not $holder.HasExited) { $holder.Kill() }
            Write-Host "::error title=Locked file smoke::--stop reported $($stop.ExitCode)"
            throw "--stop could not release the folder"
          }

          # Главная проверка: вердикт правдив - папка действительно удаляется.
          try {
            Remove-Item -Recurse -Force $root -ErrorAction Stop
          } catch {
            if (-not $holder.HasExited) { $holder.Kill() }
            Write-Host "::error title=Locked file smoke::--stop said the folder is free, but it is not: $_"
            throw "The folder is still locked after --stop"
          }
          if (-not $holder.HasExited) { $holder.Kill() }

      - name: Smoke test - update inside the portable folder
        shell: pwsh
        run: |
          function Fail([string]$why) {
            $root = Join-Path $env:RUNNER_TEMP "UpdateSmoke"
            $log = Join-Path $root "PortableData/launcher-update.log"
            $logText = if (Test-Path $log) { Get-Content $log -Raw } else { "no update log" }
            $run = Join-Path $root "PortableData/launcher-run.log"
            $runText = if (Test-Path $run) { Get-Content $run -Raw } else { "no run log" }
            $err = Join-Path $root "PortableData/launcher-exe-error.log"
            $errText = if (Test-Path $err) { Get-Content $err -Raw } else { "no error log" }
            $tree = (Get-ChildItem -Recurse -Force $root -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Substring($root.Length) }) -join "`n"
            $d = "$why`n--- update log ---`n$logText`n--- run log ---`n$runText`n--- error log ---`n$errText`n--- tree ---`n$tree"
            $d = $d.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Update smoke failure::$d"
            throw $why
          }
          try {
            # Регрессия на «перезапуск для обновления»: новая версия должна
            # встать внутрь портатива через временную папку, прежняя - уйти в
            # Updates\backup, данные PortableData - остаться на месте, а
            # установщик не должен оставить следов на этом ПК.
            $root = Join-Path $env:RUNNER_TEMP "UpdateSmoke"
            New-Item -ItemType Directory -Force -Path (Join-Path $root "App") | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $root "PortableData/User") | Out-Null
            Copy-Item dist/PortableLauncher.exe (Join-Path $root "App/LaunchPortable.exe")
            Copy-Item $env:ComSpec (Join-Path $root "App/cmd.exe")
            Set-Content -Path (Join-Path $root "App/old-version.txt") -Value "old"
            Set-Content -Path (Join-Path $root "PortableData/User/keep.txt") -Value "mine"
            $culture = (Get-UICulture).Name
            $muiSource = Join-Path (Split-Path $env:ComSpec) "$culture/cmd.exe.mui"
            if (Test-Path $muiSource) {
              New-Item -ItemType Directory -Force -Path (Join-Path $root "App/$culture") | Out-Null
              Copy-Item $muiSource (Join-Path $root "App/$culture/cmd.exe.mui")
            }
            @{
              app_name = "UpdateSmoke"
              target_exe_rel = "App/cmd.exe"
              data_dir_name = "PortableData"
              registry = @{ enabled = $false }
              update = @{ installer_args = @("{DIR}") }
            } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $root "launcher_config.json")

            # «Установщик»: кладёт cmd.exe и новый файл в папку из первого аргумента.
            $installer = Join-Path $env:RUNNER_TEMP "FakeSetup.cmd"
            @(
              '@echo off',
              'mkdir "%~1" 2>nul',
              'copy /y "%ComSpec%" "%~1\cmd.exe" >nul',
              'echo new> "%~1\new-version.txt"',
              'exit /b 0'
            ) | Set-Content -Encoding ascii $installer

            $process = Start-Process -FilePath (Join-Path $root "App/LaunchPortable.exe") `
              -ArgumentList @('--update', $installer, '--yes') -PassThru
            if (-not $process.WaitForExit(180000)) {
              $process.Kill()
              Write-Host "::error title=Update smoke failure::the launcher did not finish the update within 180 s"
              throw "UPDATE-SMOKE: --update did not finish within 180 s"
            }
            $log = Join-Path $root "PortableData/launcher-update.log"
            $logText = if (Test-Path $log) { Get-Content $log -Raw } else { "no update log" }
            Write-Host $logText
            if ($process.ExitCode -ne 0) {
              $d = $logText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Update smoke failure::exit=$($process.ExitCode); $d"
              throw "UPDATE-SMOKE: --update returned $($process.ExitCode)"
            }
            if (-not (Test-Path (Join-Path $root "App/new-version.txt"))) { throw "UPDATE-SMOKE: the new version was not swapped into App" }
            if (-not (Test-Path (Join-Path $root "Updates/backup/cmd.exe"))) { throw "UPDATE-SMOKE: the previous version was not kept in Updates/backup" }
            if (-not (Test-Path (Join-Path $root "PortableData/User/keep.txt"))) { throw "UPDATE-SMOKE: PortableData was touched" }
            if (-not (Test-Path (Join-Path $root "App/old-version.txt"))) { throw "UPDATE-SMOKE: files that the installer does not ship must stay" }
            if (Test-Path (Join-Path $root "Updates/stage")) { throw "UPDATE-SMOKE: the temporary stage folder was not removed" }

            # Откат возвращает прежнюю версию.
            $rb = Start-Process -FilePath (Join-Path $root "App/LaunchPortable.exe") `
              -ArgumentList @('--rollback', '--yes') -PassThru
            if (-not $rb.WaitForExit(120000)) { $rb.Kill(); throw "UPDATE-SMOKE: --rollback did not finish" }
            if ($rb.ExitCode -ne 0) { throw "UPDATE-SMOKE: --rollback returned $($rb.ExitCode)" }
            if (Test-Path (Join-Path $root "App/new-version.txt")) { throw "UPDATE-SMOKE: rollback left the new file in App" }
          } catch {
            Fail ($_.Exception.Message + ' at ' + $_.InvocationInfo.PositionMessage)
          }

      - name: Smoke test (import only)
        run: |
          python -c "import portablizer, portablizer.core.portablizer, portablizer.gui.main_window; print('import OK')"

      - name: Show artifact
        run: dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portablizer-windows-x64
          path: dist/Portablizer.exe
          if-no-files-found: error
          retention-days: 30

      # Артефакты Actions хранятся на blob-хранилище, недоступном из некоторых
      # окружений. Поэтому дополнительно кладём собранный exe прямо в ветку,
      # чтобы его можно было получить обычным git pull.
      - name: Commit built EXE back to branch
        if: startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: |
          set -e
          mkdir -p dist-windows
          cp dist/Portablizer.exe dist-windows/Portablizer.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist-windows/Portablizer.exe portablizer/resources/portable_launcher.exe
          git add -f portablizer/resources/portable_launcher
          if git diff --cached --quiet; then
            echo "Собранные бинарники не отличаются от закоммиченных — обновлять нечего."
            exit 0
          fi
          git commit -m "ci: build Windows executables [skip ci]"

          # Ветка могла уехать вперёд (или вообще исчезнуть после merge PR),
          # пока шла сборка. Поэтому пушим с повторами: при отказе
          # подтягиваем ветку и переносим коммит с бинарниками поверх неё.
          # Конфликты по бинарникам всегда решаем в пользу свежей сборки.
          for attempt in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "Бинарники запушены в ${GITHUB_REF_NAME} (попытка ${attempt})."
              exit 0
            fi
            echo "Пуш отклонён, синхронизируюсь с origin/${GITHUB_REF_NAME}..."
            if ! git fetch origin "${GITHUB_REF_NAME}"; then
              echo "::warning title=Built EXE not committed::ветка ${GITHUB_REF_NAME} больше не существует на origin (PR уже влит?). Бинарник доступен только как артефакт сборки."
              exit 0
            fi
            if ! git rebase -X theirs FETCH_HEAD; then
              git rebase --abort || true
              echo "::warning title=Built EXE not committed::не удалось перенести коммит с бинарниками поверх origin/${GITHUB_REF_NAME}."
              exit 0
            fi
          done
          echo "::error title=Built EXE not committed::не удалось запушить бинарники в ${GITHUB_REF_NAME} за 3 попытки"
          exit 1

      # Полный журнал тестов нужен именно тогда, когда модуль упал: шаг
      # «Run tests» пишет только хвост в summary, а по нему не видно, какой
      # модуль замолчал или упал первым.
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-log
          path: test-output.log
          if-no-files-found: warn
          retention-days: 14

      - name: Report unit-test failures after publishing build
        if: steps.unit_tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::error title=Windows unit tests failed::see the Run tests step and summary for diagnostics"
          exit 1
